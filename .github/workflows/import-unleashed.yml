name: Import UNLEASHED pages
on:
  push:
    paths: ['.github/workflows/import-unleashed.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify payload
        run: |
          curl -sSL -o /tmp/pages.tar.gz "https://vwedcmdtsvktbirlgvdb.supabase.co/storage/v1/object/public/howls-music/www-v46-pages.tar.gz"
          echo "6a64810fea4e04c17065a784a58adf000867ab5fa2c1b1bf9f06553da01b8c70  /tmp/pages.tar.gz" | sha256sum -c -
          tar xzf /tmp/pages.tar.gz -C .
      - name: Commit pages
        run: |
          git config user.name "howling-moon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "v46: 2026 albums — current covers, current songlists; Outlaw Love and Barefoot Beaches retitled to Ghost Wanted Dead or Alive and Coconut Kisses; Songs To Cry To and Silent Treatment added; Healing Frequencies 3 to 8 tracks"
          git push
