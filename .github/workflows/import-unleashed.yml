name: Import UNLEASHED pages
on:
  push:
    paths: ['.github/workflows/import-unleashed.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify payload
        run: |
          curl -sSL -o /tmp/pages.tar.gz "https://vwedcmdtsvktbirlgvdb.supabase.co/storage/v1/object/public/howls-music/www-v49-pages.tar.gz"
          echo "f561adb5ead401a5dfe68098f200c8dcfc08f7b5a467d395f9f7556de398dc54  /tmp/pages.tar.gz" | sha256sum -c -
          tar xzf /tmp/pages.tar.gz -C .
      - name: Commit pages
        run: |
          git config user.name "howling-moon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "v49: Silent Treatment and Songs To Cry To now expand on click (cloneNode drops addEventListener bindings; re-bind .hm-open toggle) + UNLEASHED moved out of the opening banner into the Full Catalog as a 15-song card"
          git push
