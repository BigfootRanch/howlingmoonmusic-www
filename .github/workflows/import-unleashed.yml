name: Import UNLEASHED pages
on:
  push:
    paths: ['.github/workflows/import-unleashed.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify payload
        run: |
          curl -sSL -o /tmp/pages.tar.gz "https://vwedcmdtsvktbirlgvdb.supabase.co/storage/v1/object/public/howls-music/www-v15-pages.tar.gz"
          echo "bfbb09db9372d8c3de8fe49fc9c769b16edc3a15212ee9238b538ae8c5b56a58  /tmp/pages.tar.gz" | sha256sum -c -
          tar xzf /tmp/pages.tar.gz -C .
      - name: Commit pages
        run: |
          git config user.name "howling-moon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "v15: hero album player — 15 previewable tracks"
          git push
