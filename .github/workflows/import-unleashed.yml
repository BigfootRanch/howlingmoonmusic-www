name: Import UNLEASHED pages
on:
  push:
    paths: ['.github/workflows/import-unleashed.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify payload
        run: |
          curl -sSL -o /tmp/pages.tar.gz "https://vwedcmdtsvktbirlgvdb.supabase.co/storage/v1/object/public/howls-music/www-v47-pages.tar.gz"
          echo "f80983a21dee31c50d219d4c6e249e493cda90ba34a531cd16e93bae7f8a4bca  /tmp/pages.tar.gz" | sha256sum -c -
          tar xzf /tmp/pages.tar.gz -C .
      - name: Commit pages
        run: |
          git config user.name "howling-moon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "v47: 2026 albums on the catalog — Ghost Wanted, Coconut Kisses (real 16-track card), Songs To Cry To, Silent Treatment, Healing Frequencies 8; cloned cards revealed; re-applies on mutation"
          git push
