name: Import UNLEASHED pages
on:
  push:
    paths: ['.github/workflows/import-unleashed.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify payload
        run: |
          curl -sSL -o /tmp/pages.tar.gz "https://vwedcmdtsvktbirlgvdb.supabase.co/storage/v1/object/public/howls-music/www-v55-pages.tar.gz"
          echo "3d1d042970a7fd87c5d2a16692b1682d072991e43dc1b5174cce2abae41c5918  /tmp/pages.tar.gz" | sha256sum -c -
          tar xzf /tmp/pages.tar.gz -C .
      - name: Commit pages
        run: |
          git config user.name "howling-moon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "v55: 58 v5.5 masters uploaded to storage and wired into site-data (57 songs repointed off unplayable WAVs); Outlaw Love descriptor cleared from every catalog card; catalog rows cue Howling Moon Radio"
          git push
