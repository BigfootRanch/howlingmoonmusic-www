name: Import UNLEASHED pages
on:
  push:
    paths: ['.github/workflows/import-unleashed.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify payload
        run: |
          curl -sSL -o /tmp/pages.tar.gz "https://vwedcmdtsvktbirlgvdb.supabase.co/storage/v1/object/public/howls-music/unleashed-pages.tar.gz"
          echo "30b1fa8139ede6ee03bdac3d798fc6816735f27b2b5bd6b39ee491e25ce2a2ea  /tmp/pages.tar.gz" | sha256sum -c -
          tar xzf /tmp/pages.tar.gz -C .
      - name: Commit pages
        run: |
          git config user.name "howling-moon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add unleashed.html sitemap.xml songs/
          git diff --cached --quiet || git commit -m "UNLEASHED album page + 15 SEO song pages (full lyrics, HyperFollow, Apple id fix)"
          git push
