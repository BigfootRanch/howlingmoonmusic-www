name: Import UNLEASHED pages
on:
  push:
    paths: ['.github/workflows/import-unleashed.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify payload
        run: |
          curl -sSL -o /tmp/pages.tar.gz "https://vwedcmdtsvktbirlgvdb.supabase.co/storage/v1/object/public/howls-music/www-v24b-pages.tar.gz"
          echo "b38baa40d86e3a9304b0c625928c1b4f809a56aaebb6423a354a270270729063  /tmp/pages.tar.gz" | sha256sum -c -
          tar xzf /tmp/pages.tar.gz -C .
      - name: Commit pages
        run: |
          git config user.name "howling-moon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html site-data.js
          git diff --cached --quiet || git commit -m "v24b: explicit JT tracks fenced to JT pill"
          git push
