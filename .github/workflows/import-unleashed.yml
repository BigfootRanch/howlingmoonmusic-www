name: Import UNLEASHED pages
on:
  push:
    paths: ['.github/workflows/import-unleashed.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify payload
        run: |
          curl -sSL -o /tmp/pages.tar.gz "https://vwedcmdtsvktbirlgvdb.supabase.co/storage/v1/object/public/howls-music/www-v33-pages.tar.gz"
          echo "a80c69ae75a2286dd2a5aa47b68cff1277e92cb0f3e3612d3671e9f9c938721f  /tmp/pages.tar.gz" | sha256sum -c -
          tar xzf /tmp/pages.tar.gz -C .
      - name: Commit pages
        run: |
          git config user.name "howling-moon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "v33: PuppyFM art on home + dog-songs, UNLEASHED background art, footer line removed sitewide"
          git push
